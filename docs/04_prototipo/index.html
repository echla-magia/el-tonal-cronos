<script>
  // ---------- UTILIDADES DE BÚSQUEDA Y RESOLUCIÓN ----------
  const tipos = { persons:'PER', orgs:'ORG', videos:'VID', claims:'CLM', events:'EVT', sources:'SRC', conflicts:'CNF', rels:'REL' };
  const all = () => [...DB.persons,...DB.orgs,...DB.videos,...DB.claims,...DB.events,...DB.sources];
  function busco(entidad){ return all().find(e=>e.id===entidad); }
  function enlazar(id){ const e=busco(id); if(!e)return ''; return `<a onclick="abrirFicha('${id}')">${e.name||e.title||e.text||id}</a>`; }
  function nombreCorto(id){ const e=busco(id); if(!e) return id; return (e.name||e.title||(e.text||'').slice(0,30)).slice(0,34); }
  function tipoDe(id){ return id.split('-')[0]; }
  function rutaArchivo(id){ if(id.startsWith('SRC')) return id; const e=busco(id); return e&&e.url?e.url:''; }
  function certezaBadge(c){
    if(!c) return '';
    if(c.toLowerCase().includes('docum')) return `<span class="badge b-doc">DOCUMENTADO</span>`;
    if(c.toLowerCase().includes('corrob')) return `<span class="badge b-cer">CORROBORADO</span>`;
    if(c.toLowerCase().includes('report')||c.toLowerCase().includes('aleg')) return `<span class="badge b-rep">REPORTADO</span>`;
    if(c.toLowerCase().includes('pend')||c.toLowerCase().includes('verific')) return `<span class="badge b-pen">PENDIENTE/NO VERIF.</span>`;
    if(c.toLowerCase().includes('refut')) return `<span class="badge b-roro">REFUTADO</span>`;
    return `<span class="badge b-pen">${c.toUpperCase()}</span>`;
  }

  // ---------- BÚSQUEDA TIEMPO REAL ----------
  function buscarTiempoReal(){
    const q=document.getElementById('buscarInput').value.trim().toLowerCase();
    const box=document.getElementById('resultados');
    if(q.length<2){ box.style.display='none'; return; }
    const hits=all().filter(e=>JSON.stringify(e).toLowerCase().includes(q)).slice(0,8);
    if(!hits.length){ box.innerHTML='<div class="r" style="color:var(--gris)">Sin resultados</div>'; box.style.display='block'; return; }
    box.innerHTML=hits.map(e=>`<div class="r" onclick="abrirFicha('${e.id}');this.parentNode.style.display='none'"><b>${e.name||e.title||(e.text||'').slice(0,40)}</b> <span style="color:var(--gris)">— ${e.id}</span></div>`).join('');
    box.style.display='block';
  }
  document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) document.getElementById('resultados').style.display='none'; });

  // ---------- ENRUTADO ----------
  function abrirFicha(id){ 
    const e=busco(id); if(!e){renderHome();return;}
    window.scrollTo({top:0,behavior:'smooth'});
    if(e.prefixed&&tipoDe(id)==='PER') fichaPersona(id); else if(e.id.startsWith('PER')) fichaPersona(id);
    else if(e.id.startsWith('ORG')) fichaOrg(id);
    else if(e.id.startsWith('VID')) fichaVideo(id);
    else if(e.id.startsWith('CLM')) fichaClaim(id);
        else if(e.id.startsWith('SRC')) fichaSrc(id);
        else if(e.id.startsWith('EVT')) fichaEvent(id);
        else fichaPersona(id);
      }
      function fichaEvent(id){
        const e=busco(id);
        const rels=(DB.rels||[]).filter(r=>r.subject===id||r.object===id);
        document.getElementById('app').innerHTML=`<div class="panel">
          <h2>📅 ${e.name||e.title}</h2>
          <table><tbody>
            <tr><th>ID</th><td>${e.id}</td></tr>
            ${e.date||e.fecha?`<tr><th>Fecha</th><td>${e.date||e.fecha}</td></tr>`:''}
            ${e.place?`<tr><th>Lugar</th><td>${e.place}</td></tr>`:''}
            ${e.certainty?`<tr><th>Certeza</th><td>${certezaBadge(e.certainty)}</td></tr>`:''}
          </tbody></table>
          <p style="color:var(--gris);margin-top:12px">${e.desc||e.descripcion_corta||'Sin descripción.'}</p>
          <h3>Relaciones (${rels.length})</h3>
          ${rels.length?`<ul style="list-style:none;padding:0">${rels.map(r=>`<li style="padding:4px 0;font-size:13px">${enlazar(r.subject)} <b>${r.predicate}</b> ${enlazar(r.object)}</li>`).join('')}</ul>`:'·'}
        </div>`;
      }
  window.abrirFicha = abrirFicha;

  h+='</tbody></table>';
  if(actores.length){
    h+='<h4>👥 Actores detectados</h4><table><thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Cargo</th><th>Verificación</th></tr></thead><tbody>';
    actores.forEach(function(a,i){
      var id='PER-'+(DB.persons.length+i+1);
      h+='<tr><td>'+id+'</td><td>'+a+'</td><td>PERSONA</td><td>'+((actual.cargo)||'NO DISPONIBLE EN EL ARCHIVO ACTUAL')+'</td><td><span class="badge b-doc">HECHO DOCUMENTADO</span></td></tr>';
    });
    h+='</tbody></table>';
  }
  if(!actores.length && !url){h+='<div style="color:var(--gris);margin-top:10px">Sin material detectado. Pega texto en formato INCORPORAR o una URL.</div>';}
  // video/url
  if(url){registros.push({tipo:'URL',val:url,n:'URL'});}
  h+='<p style="color:var(--gris);font-size:11px;margin-top:12px">Regla: cada flecha debe responder "¿qu\u00e9 evidencia demuestra esta conexi\u00f3n?". Lo no verificado queda como hip\u00f3tesis/alegaci\u00f3n, nunca hecho.</p>';
  // listar registros crudos
  if(registros.length){
    h+='<h4>📦 Registros incorporados (bruto)</h4><ul style="font-size:12px;max-height:180px;overflow:auto">';
    registros.slice(0,30).forEach(function(r){h+='<li>['+r.tipo+'] '+r.n+': <b>'+r.val+'</b></li>';});
    h+='</ul>';
  }
  out.innerHTML=h;
}

  var top=Object.keys(grado).sort(function(a,b){return grado[b]-grado[a]}).slice(0,6);

    +'<tr><th>Lobby + contratos + reuniones</th><td>'+rels.filter(function(r){return /LOBBY|FARA|REUNIO/.test(r.tipo||'')}).length+'</td></tr>'
    +'<tr><th>Nodos más conectados</th><td>'+top.map(function(id){return nombre(id)+' ('+grado[id]+')';}).join(', ')+'</td></tr>'

function ejecutarConsulta(){
  var tipo=document.getElementById('consulta-tipo').value;
  var rels=DB.rels||[];
  var tip={};
  DB.persons.forEach(function(p){tip[p.id]=p.name});DB.orgs.forEach(function(o){tip[o.id]=o.name});
  DB.videos.forEach(function(v){if(v&&v.id)tip[v.id]=v.title||v.id;});
  DB.claims.forEach(function(c){if(c&&c.id)tip[c.id]=(c.text||c.id);});
  var nombre=function(id){return tip[id]||id;};
  var res;
  if(tipo==='TODAS') res=rels.slice();
  else res=rels.filter(function(r){return (r.tipo||'')===tipo || (r.predicate||'').toUpperCase().indexOf(tipo.toLowerCase())>=0;});
  var out=document.getElementById('consulta-resultado');
  if(!res.length){out.innerHTML='<p style="color:#D8D0C2;font-size:12px">Sin relaciones de tipo <b>'+tipo+'</b> en el archivo (los datos existentes son de otros tipos).</p>';return;}
  var h='<p style="color:#C79227;font-weight:700;font-size:13px">'+tipo+': '+res.length+' relación(es)</p><table style="font-size:12px;max-height:260px;display:block;overflow:auto"><thead><tr><th>Origen</th><th>Relación</th><th>Destino</th><th>Evid.</th></tr></thead><tbody>';
  res.slice(0,30).forEach(function(r){h+='<tr><td>'+nombre(r.subject||r.origen)+'</td><td>'+((r.tipo||r.predicate)||'')+'</td><td>'+nombre(r.object||r.destino)+'</td><td>'+(r.evidencia||'C')+'</td></tr>';});
  h+='</tbody></table>';
  out.innerHTML=h;
}
window.ejecutarConsulta=ejecutarConsulta;

function decorarAvatares(){
  // en ultimos registros: remplazar el emoji del avatar por la foto real si el registro tiene img
  var name2ibj={};
  DB.persons.forEach(function(p){name2ibj[p.name]=p;});
  DB.orgs.forEach(function(o){name2ibj[o.name]=o;});
  document.querySelectorAll('.reg').forEach(function(row){
    var nomEl=row.querySelector('.reg-info b');if(!nomEl)return;
    var nombre=nomEl.textContent.trim();
    var obj=name2ibj[nombre];if(!obj||!obj.img)return;
    var av=row.querySelector('.reg-avatar');if(!av)return;
    var f=obj.img.split('/').pop();
    av.innerHTML='<img src="/cronos/img/'+f+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block" onerror="this.remove()">';
  });
}

  renderHome();
  setTimeout(decorarAvatares,50);
</script>
